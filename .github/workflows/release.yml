name: release

# Release builds for Windows, Linux and macOS: one archive per platform with the waxbill binary, README,
# LICENSE and NOTICE. On a v* tag the archives are also attached to a draft GitHub Release; run by hand, they
# are workflow artifacts only. Serval is released separately (its own repository).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: waxbill

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu: the binary links against its glibc and runs on newer systems.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # GPUI's Linux backend: fonts (fontconfig, freetype), Wayland and X11 input (xkbcommon, xcb).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ env.BIN_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          $staging = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" $staging
          foreach ($doc in "README.md", "LICENSE", "NOTICE") { if (Test-Path $doc) { Copy-Item $doc $staging } }
          Compress-Archive -Path "$staging/*" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          staging="${RUNNER_TEMP}/${name}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${staging}/"
          chmod +x "${staging}/${BIN_NAME}"
          for doc in README.md LICENSE NOTICE; do [ -f "$doc" ] && cp "$doc" "${staging}/"; done
          if [ "${RUNNER_OS}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "${staging}" "${name}.zip"
            echo "ASSET=${name}.zip" >> "${GITHUB_ENV}"
          else
            tar -C "${RUNNER_TEMP}" -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "${GITHUB_ENV}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  draft-release:
    # Tags only: a draft to check before publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # v2.0.0-beta.1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: archives/*
