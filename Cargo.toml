[package]
name = "maze-serval-gpui"
version = "2.0.0-dev"
edition = "2024"
default-run = "waxbill"
description = "Waxbill: a desktop app for Serval, the camera-trap data tool."
license = "Apache-2.0"
repository = "https://github.com/wsyxbcl/serval-gpui"

[[bin]]
name = "waxbill"
path = "src/main.rs"

[dependencies]
# Pinned exactly: gpui-kit follows weekly GPUI snapshots (W01).
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3.0.2"
