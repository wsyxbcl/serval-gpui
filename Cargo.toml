[package]
name = "maze-serval-gpui"
version = "1.0.1"
edition = "2021"
default-run = "waxbill"
description = "Native GPUI desktop wrapper for the Serval CLI."
license = "Apache-2.0"
repository = "https://github.com/wsyxbcl/serval-gpui"

[[bin]]
name = "waxbill"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
unicode-segmentation = "1.11"
portable-pty = "0.9"

[build-dependencies]
embed-resource = "3.0.2"
