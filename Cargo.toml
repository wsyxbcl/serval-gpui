[package]
name = "maze-serval-gpui"
version = "2.0.0"
edition = "2024"
default-run = "waxbill"
description = "Waxbill: a desktop app for Serval, the camera-trap data tool."
license = "Apache-2.0"
repository = "https://github.com/wsyxbcl/serval-gpui"

[[bin]]
name = "waxbill"
path = "src/main.rs"

[dependencies]
csv = "1"
# GBK and UTF-16 tables from Excel (repair.rs).
encoding_rs = "0.8"
# Pinned exactly: gpui-kit follows weekly GPUI snapshots (W01).
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Caracal bridge (bridge.rs): a loopback server and its session tokens.
tiny_http = "0.12"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Serval ends with Waxbill (runner.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Rendering tests (results.rs: the log scrolls inside the scrolling page).
gpui-kit = { version = "=0.7.1", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.2"
